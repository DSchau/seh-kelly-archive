<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S.E.H Kelly archive</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="header">
  <h1>S.E.H Kelly archive</h1>
  <p class="sub" id="count"></p>
  <div class="filters">
    <input id="q" type="search" placeholder="Search name, fabric, colour...">
    <select id="cat"><option value="">All categories</option></select>
    <select id="mat"><option value="">All materials</option></select>
    <select id="year"><option value="">All years</option></select>
    <select id="status"><option value="">Any status</option><option>in production</option><option>archived</option></select>
  </div>
</header>
<main id="grid"></main>
<main id="detail-page" class="hidden">
  <button id="back">&larr; Back to the archive</button>
  <div id="photos"></div>
  <div id="meta"></div>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
